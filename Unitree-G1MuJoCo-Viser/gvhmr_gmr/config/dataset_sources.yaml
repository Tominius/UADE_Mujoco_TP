project_root: .

video_routes:
  user_upload:
    kind: video
    route: gvhmr_then_gmr
    input_dir: gvhmr_gmr/videos
    gvhmr_out_dir: gvhmr_gmr/artifacts/gvhmr/user_videos
    gmr_out_dir: gvhmr_gmr/artifacts/gmr/user_videos
  aistpp_samples:
    kind: video
    route: gvhmr_then_gmr
    input_dir: gvhmr_gmr/videos/aist_samples
    gvhmr_out_dir: gvhmr_gmr/artifacts/gvhmr/aistpp
    gmr_out_dir: gvhmr_gmr/artifacts/gmr/aistpp

motion_routes:
  amass:
    kind: smplx
    route: gmr_smplx_batch
    input_dir: gvhmr_gmr/datasets/amass
    gmr_out_dir: gvhmr_gmr/artifacts/gmr/amass
  lafan1:
    kind: bvh
    route: gmr_bvh_batch
    bvh_format: lafan1
    input_dir: gvhmr_gmr/datasets/lafan1
    gmr_out_dir: gvhmr_gmr/artifacts/gmr/lafan1
  bvh_generic:
    kind: bvh
    route: gmr_bvh_batch
    bvh_format: lafan1
    input_dir: gvhmr_gmr/datasets/bvh
    gmr_out_dir: gvhmr_gmr/artifacts/gmr/bvh
  fbx_generic:
    kind: fbx
    route: gmr_fbx_batch
    input_dir: gvhmr_gmr/datasets/fbx
    gmr_out_dir: gvhmr_gmr/artifacts/gmr/fbx
  smplx_generic:
    kind: smplx
    route: gmr_smplx_batch
    input_dir: gvhmr_gmr/datasets/smplx
    gmr_out_dir: gvhmr_gmr/artifacts/gmr/smplx

# UI labels for generated_groups in the gallery tab
generated_group_labels:
  user_upload: 用户视频生成
  aistpp_samples: AIST++ 生成
  amass: AMASS 生成
  lafan1: LAFAN1 生成
  bvh_generic: BVH 生成
  fbx_generic: FBX 生成
  smplx_generic: SMPL-X 生成
